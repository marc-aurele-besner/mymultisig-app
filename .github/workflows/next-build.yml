name: Next-Build-Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Yarn Install
        run: yarn
      # The app signs and executes through packages/sdk/src/protocol, so a
      # protocol change must keep the SDK, MCP server and CLI green too.
      - name: Build agent packages (sdk, mcp, cli)
        run: yarn packages:build
      - name: Test agent packages
        run: yarn packages:test
      - name: Next Build
        run: yarn build
